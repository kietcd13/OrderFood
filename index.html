<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Đặt Đồ Ăn</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, collection, onSnapshot, doc, setDoc, addDoc, updateDoc, deleteDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    const { useState, useEffect } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyDyl2FoFZwKtFL6yb2sPEEWzJvBBzNK01A",
      authDomain: "taskhub-c3f41.firebaseapp.com",
      projectId: "taskhub-c3f41",
      storageBucket: "taskhub-c3f41.firebasestorage.app",
      messagingSenderId: "874827473111",
      appId: "1:874827473111:web:cdbd7c6b8d5ece0d285092"
    };

    const app = !getApps().length ? initializeApp(firebaseConfig) : getApp();
    const auth = getAuth(app);
    const db = getFirestore(app);

    const getColl = (name) => collection(db, 'artifacts', 'food-order', 'public', 'data', name);
    const getDocRef = (name, docId) => doc(db, 'artifacts', 'food-order', 'public', 'data', name, docId);

    const Icon = ({ name, size = 24, className = "" }) => {
      const paths = {
        UserPlus: <><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></>,
        PlusCircle: <><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></>,
        LogOut: <><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></>,
        Utensils: <><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></>,
        ClipboardList: <><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></>,
        User: <><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></>,
        Lock: <><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></>,
        ChefHat: <><path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z"/><line x1="6" y1="17" x2="18" y2="17"/></>,
        ShoppingCart: <><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></>,
        Trash2: <><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></>,
        CheckCircle: <><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></>,
        Clock: <><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>,
        Key: <><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></>
      };
      return (
        <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          {paths[name]}
        </svg>
      );
    };

    function App() {
      const [users, setUsers] = useState([]);
      const [menuItems, setMenuItems] = useState([]);
      const [orders, setOrders] = useState([]);
      const [currentUser, setCurrentUser] = useState(null);
      const [firebaseUser, setFirebaseUser] = useState(null);
      const [messageBox, setMessageBox] = useState(null);

      const showMessage = (msg) => setMessageBox({ type: 'alert', message: msg });
      const showConfirm = (msg, onConfirm) => setMessageBox({ type: 'confirm', message: msg, onConfirm });

      useEffect(() => {
        signInAnonymously(auth).catch(console.error);
        const unsub = onAuthStateChanged(auth, user => setFirebaseUser(user));
        return () => unsub();
      }, []);

      useEffect(() => {
        if (!firebaseUser) return;
        
        const unsubUsers = onSnapshot(getColl('users'), snap => {
          if (snap.empty) {
            setDoc(getDocRef('users', 'admin'), { username: 'admin', password: '123', role: 'admin' });
          } else {
            setUsers(snap.docs.map(d => ({ id: d.id, ...d.data() })));
          }
        }, console.error);

        const unsubMenu = onSnapshot(getColl('menuItems'), snap => {
          setMenuItems(snap.docs.map(d => ({ id: d.id, ...d.data() })));
        }, console.error);

        const unsubOrders = onSnapshot(getColl('orders'), snap => {
          setOrders(snap.docs.map(d => ({ id: d.id, ...d.data() })));
        }, console.error);

        return () => { unsubUsers(); unsubMenu(); unsubOrders(); };
      }, [firebaseUser]);

      const Login = () => {
        const [username, setUsername] = useState('');
        const [password, setPassword] = useState('');
        const [error, setError] = useState('');

        const handleLogin = (e) => {
          e.preventDefault();
          const user = users.find(u => u.username === username && u.password === password);
          if (user) {
            setCurrentUser(user);
            setError('');
          } else {
            setError('Sai tên đăng nhập hoặc mật khẩu!');
          }
        };

        return (
          <div className="min-h-screen bg-gray-100 flex items-center justify-center p-4">
            <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
              <div className="flex flex-col items-center mb-8">
                <div className="bg-blue-100 p-3 rounded-full text-blue-600 mb-4">
                  <Icon name="Utensils" size={32} />
                </div>
                <h1 className="text-2xl font-bold text-gray-800">Hệ Thống Đặt Đồ Ăn</h1>
              </div>
              
              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">Tên đăng nhập</label>
                  <div className="relative">
                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                      <Icon name="User" size={18} />
                    </div>
                    <input type="text" value={username} onChange={(e) => setUsername(e.target.value)} className="pl-10 w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Nhập tên đăng nhập..." required />
                  </div>
                </div>
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">Mật khẩu</label>
                  <div className="relative">
                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                      <Icon name="Lock" size={18} />
                    </div>
                    <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} className="pl-10 w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Nhập mật khẩu..." required />
                  </div>
                </div>
                {error && <p className="text-red-500 text-sm text-center">{error}</p>}
                <button type="submit" className="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">Đăng Nhập</button>
              </form>
            </div>
          </div>
        );
      };

      const AdminDashboard = () => {
        const [newUsername, setNewUsername] = useState('');
        const [newPassword, setNewPassword] = useState('');
        const [foodName, setFoodName] = useState('');
        const [foodNote, setFoodNote] = useState('');
        const [activeTab, setActiveTab] = useState('menu');
        const [selectedUserFilter, setSelectedUserFilter] = useState('all');

        const handleCreateUser = async (e) => {
          e.preventDefault();
          if (users.some(u => u.username === newUsername)) {
            showMessage('Tên người dùng đã tồn tại!');
            return;
          }
          await addDoc(getColl('users'), { username: newUsername, password: newPassword, role: 'user' });
          setNewUsername('');
          setNewPassword('');
          showMessage('Tạo người dùng thành công!');
        };

        const handleCreateFood = async (e) => {
          e.preventDefault();
          await addDoc(getColl('menuItems'), { name: foodName, note: foodNote });
          setFoodName('');
          setFoodNote('');
          showMessage('Thêm món thành công!');
        };

        const confirmOrder = async (orderId) => {
          await updateDoc(getDocRef('orders', orderId), { status: 'confirmed' });
        };

        return (
          <div className="min-h-screen bg-gray-50">
            <header className="bg-white shadow-sm p-4 flex justify-between items-center">
              <h1 className="text-xl font-bold flex items-center gap-2 text-blue-600">
                <Icon name="ChefHat" size={24} /> Admin Panel
              </h1>
              <button onClick={() => setCurrentUser(null)} className="text-gray-500 hover:text-red-500 flex items-center gap-1">
                <Icon name="LogOut" size={18} /> Đăng xuất
              </button>
            </header>

            <div className="max-w-4xl mx-auto mt-6 px-4 pb-12">
              <div className="flex gap-2 mb-6 border-b border-gray-200 pb-2 overflow-x-auto">
                <button onClick={() => setActiveTab('menu')} className={`px-4 py-2 rounded-lg font-medium whitespace-nowrap ${activeTab === 'menu' ? 'bg-blue-100 text-blue-700' : 'text-gray-600 hover:bg-gray-100'}`}>Tạo Món Ăn</button>
                <button onClick={() => setActiveTab('users')} className={`px-4 py-2 rounded-lg font-medium whitespace-nowrap ${activeTab === 'users' ? 'bg-blue-100 text-blue-700' : 'text-gray-600 hover:bg-gray-100'}`}>Tạo Người Dùng</button>
                <button onClick={() => setActiveTab('orders')} className={`px-4 py-2 rounded-lg font-medium whitespace-nowrap ${activeTab === 'orders' ? 'bg-blue-100 text-blue-700' : 'text-gray-600 hover:bg-gray-100'}`}>Xem Đơn Hàng</button>
              </div>

              {activeTab === 'menu' && (
                <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                  <h2 className="text-lg font-bold mb-4 flex items-center gap-2"><Icon name="PlusCircle" size={20}/> Thêm món cho hôm nay</h2>
                  <form onSubmit={handleCreateFood} className="space-y-4">
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-1">Tên món ăn</label>
                      <input type="text" value={foodName} onChange={(e) => setFoodName(e.target.value)} className="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 outline-none" required />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-1">Ghi chú</label>
                      <textarea value={foodNote} onChange={(e) => setFoodNote(e.target.value)} className="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 outline-none" rows="3" />
                    </div>
                    <button type="submit" className="bg-blue-600 text-white px-4 py-2 rounded font-medium hover:bg-blue-700">Lưu Món</button>
                  </form>
                  <div className="mt-8">
                    <h3 className="font-bold text-gray-700 mb-3">Danh sách món hôm nay:</h3>
                    <ul className="space-y-2">
                      {menuItems.map(item => (
                        <li key={item.id} className="p-3 bg-gray-50 border border-gray-100 rounded">
                          <p className="font-bold">{item.name}</p>
                          <p className="text-sm text-gray-600">{item.note}</p>
                        </li>
                      ))}
                    </ul>
                  </div>
                </div>
              )}

              {activeTab === 'users' && (
                <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                  <h2 className="text-lg font-bold mb-4 flex items-center gap-2"><Icon name="UserPlus" size={20}/> Tạo tài khoản người đặt</h2>
                  <form onSubmit={handleCreateUser} className="space-y-4">
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-1">Tên đăng nhập</label>
                      <input type="text" value={newUsername} onChange={(e) => setNewUsername(e.target.value)} className="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 outline-none" required />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-1">Mật khẩu</label>
                      <input type="text" value={newPassword} onChange={(e) => setNewPassword(e.target.value)} className="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 outline-none" required />
                    </div>
                    <button type="submit" className="bg-green-600 text-white px-4 py-2 rounded font-medium hover:bg-green-700">Tạo Tài Khoản</button>
                  </form>
                  <div className="mt-8">
                    <ul className="grid grid-cols-1 md:grid-cols-2 gap-2">
                      {users.filter(u => u.role !== 'admin').map((u, idx) => (
                        <li key={idx} className="p-3 bg-gray-50 border border-gray-100 rounded text-sm flex justify-between items-center">
                          <div>
                            <span>User: <strong>{u.username}</strong></span>
                            <span className="text-gray-500 ml-3">Pass: {u.password}</span>
                          </div>
                          <button 
                            onClick={() => { setActiveTab('orders'); setSelectedUserFilter(u.username); }}
                            className="text-blue-600 hover:text-blue-800 font-medium underline text-xs"
                          >
                            Xem lịch sử
                          </button>
                        </li>
                      ))}
                    </ul>
                  </div>
                </div>
              )}

              {activeTab === 'orders' && (
                <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-4">
                    <h2 className="text-lg font-bold flex items-center gap-2"><Icon name="ClipboardList" size={20}/> Quản lý đơn hàng</h2>
                    <select
                      value={selectedUserFilter}
                      onChange={(e) => setSelectedUserFilter(e.target.value)}
                      className="p-2 border border-gray-300 rounded outline-none focus:border-blue-500 bg-gray-50 min-w-[200px]"
                    >
                      <option value="all">Tất cả người dùng</option>
                      {users.filter(u => u.role !== 'admin').map((u, idx) => (
                        <option key={idx} value={u.username}>{u.username}</option>
                      ))}
                    </select>
                  </div>
                  {orders.filter(o => selectedUserFilter === 'all' || o.username === selectedUserFilter).length === 0 ? <p className="text-gray-500 italic">Không có đơn hàng nào.</p> : (
                    <div className="overflow-x-auto">
                      <table className="w-full text-left border-collapse">
                        <thead>
                          <tr className="bg-gray-100">
                            <th className="p-3 border-b">Người đặt</th>
                            <th className="p-3 border-b">Món ăn</th>
                            <th className="p-3 border-b">Tùy chọn</th>
                            <th className="p-3 border-b">Số lượng</th>
                            <th className="p-3 border-b">Trạng thái</th>
                            <th className="p-3 border-b">Hành động</th>
                          </tr>
                        </thead>
                        <tbody>
                          {orders.filter(o => selectedUserFilter === 'all' || o.username === selectedUserFilter).map((order) => {
                            const item = menuItems.find(m => m.id === order.itemId);
                            return (
                              <tr key={order.id} className="border-b hover:bg-gray-50">
                                <td className="p-3 font-medium">{order.username}</td>
                                <td className="p-3">{item ? item.name : 'Món đã xóa'}</td>
                                <td className="p-3"><span className="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded-full font-medium">{order.option}</span></td>
                                <td className="p-3 font-bold text-blue-600">{order.quantity}</td>
                                <td className="p-3">
                                  {order.status === 'confirmed' ? (
                                    <span className="text-green-600 flex items-center gap-1 text-sm font-medium"><Icon name="CheckCircle" size={16}/> Đã chốt</span>
                                  ) : (
                                    <span className="text-orange-500 flex items-center gap-1 text-sm font-medium"><Icon name="Clock" size={16}/> Chờ chốt</span>
                                  )}
                                </td>
                                <td className="p-3">
                                  {order.status !== 'confirmed' && (
                                    <button onClick={() => confirmOrder(order.id)} className="bg-green-500 text-white px-3 py-1 rounded text-sm hover:bg-green-600 font-medium">Xác nhận</button>
                                  )}
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>
              )}
            </div>
          </div>
        );
      };

      const UserDashboard = () => {
        const [quantities, setQuantities] = useState({});
        const [selectedMainOptions, setSelectedMainOptions] = useState({});
        const [selectedSubOptions, setSelectedSubOptions] = useState({});
        const [activeTab, setActiveTab] = useState('menu');
        
        // Mật khẩu
        const [oldPass, setOldPass] = useState('');
        const [newPass, setNewPass] = useState('');

        const handleSliderChange = (itemId, val) => {
          setQuantities(prev => ({ ...prev, [itemId]: parseInt(val) }));
        };

        const handleOrder = async () => {
          let totalItems = 0;
          let orderedCount = 0;

          const promises = Object.entries(quantities).map(async ([itemId, qty]) => {
            if (qty > 0) {
              const mainOpt = selectedMainOptions[itemId] || 'Handicap';
              const subOpt = selectedSubOptions[itemId] || 'Trên';
              const finalOption = `${mainOpt} - ${subOpt}`;

              await addDoc(getColl('orders'), { 
                username: currentUser.username, 
                itemId: itemId, 
                quantity: qty, 
                option: finalOption,
                status: 'pending'
              });
              totalItems += qty;
              orderedCount++;
            }
          });

          await Promise.all(promises);

          if (orderedCount === 0) {
            showMessage('Vui lòng chọn ít nhất 1 món để đặt!');
            return;
          }

          setQuantities({});
          setSelectedMainOptions({});
          setSelectedSubOptions({});
          showMessage(`Đã đặt thành công ${totalItems} phần!`);
          setActiveTab('history');
        };

        const handleAdjustQuantity = async (orderId, newQty) => {
          if (newQty <= 0) {
            showConfirm("Bạn có chắc muốn hủy đặt món này?", async () => {
              await deleteDoc(getDocRef('orders', orderId));
            });
          } else {
            await updateDoc(getDocRef('orders', orderId), { quantity: newQty });
          }
        };

        const handleChangePassword = async (e) => {
          e.preventDefault();
          if (oldPass !== currentUser.password) {
            showMessage('Mật khẩu cũ không chính xác!');
            return;
          }
          if (newPass.length < 3) {
            showMessage('Mật khẩu mới quá ngắn!');
            return;
          }
          await updateDoc(getDocRef('users', currentUser.id), { password: newPass });
          setCurrentUser({...currentUser, password: newPass});
          setOldPass('');
          setNewPass('');
          showMessage('Đổi mật khẩu thành công!');
        };

        const myOrders = orders.filter(o => o.username === currentUser.username);

        return (
          <div className="min-h-screen bg-gray-50 pb-24">
            <header className="bg-white shadow-sm p-4 flex justify-between items-center sticky top-0 z-10">
              <h1 className="text-xl font-bold flex items-center gap-2 text-green-600">
                <Icon name="Utensils" size={24} /> Thực Đơn
              </h1>
              <div className="flex items-center gap-4">
                <span className="text-sm font-medium text-gray-600">Chào, {currentUser.username}</span>
                <button onClick={() => setCurrentUser(null)} className="text-gray-500 hover:text-red-500">
                  <Icon name="LogOut" size={20} />
                </button>
              </div>
            </header>

            <div className="max-w-2xl mx-auto mt-6 px-4">
              <div className="flex gap-2 mb-6 border-b border-gray-200 pb-2 overflow-x-auto">
                <button onClick={() => setActiveTab('menu')} className={`px-4 py-2 rounded-lg font-medium whitespace-nowrap ${activeTab === 'menu' ? 'bg-green-100 text-green-700' : 'text-gray-600 hover:bg-gray-100'}`}>Đặt Món</button>
                <button onClick={() => setActiveTab('history')} className={`px-4 py-2 rounded-lg font-medium whitespace-nowrap flex items-center gap-1 ${activeTab === 'history' ? 'bg-green-100 text-green-700' : 'text-gray-600 hover:bg-gray-100'}`}>
                  Đơn Của Tôi {myOrders.length > 0 && <span className="bg-red-500 text-white text-xs px-2 py-0.5 rounded-full">{myOrders.length}</span>}
                </button>
                <button onClick={() => setActiveTab('profile')} className={`px-4 py-2 rounded-lg font-medium whitespace-nowrap flex items-center gap-1 ${activeTab === 'profile' ? 'bg-green-100 text-green-700' : 'text-gray-600 hover:bg-gray-100'}`}>
                  <Icon name="Key" size={16}/> Mật Khẩu
                </button>
              </div>

              {activeTab === 'menu' && (
                menuItems.length === 0 ? (
                  <div className="text-center p-10 bg-white rounded-xl border border-gray-200"><p className="text-gray-500">Admin chưa cập nhật món ăn cho hôm nay.</p></div>
                ) : (
                  <div className="space-y-4">
                    {menuItems.map(item => {
                      const qty = quantities[item.id] || 0;
                      const mainOpt = selectedMainOptions[item.id] || 'Handicap';
                      const subOpt = selectedSubOptions[item.id] || 'Trên';
                      
                      return (
                        <div key={item.id} className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex flex-col sm:flex-row gap-4 justify-between">
                          <div className="flex-1">
                            <h3 className="text-lg font-bold text-gray-800">{item.name}</h3>
                            {item.note && <p className="text-sm text-gray-500 mt-1">{item.note}</p>}
                            
                            <div className="mt-3 bg-gray-50 p-3 rounded-lg border border-gray-200">
                              <p className="text-xs font-bold text-gray-500 mb-2 uppercase">Lựa chọn 1</p>
                              <div className="flex gap-4 mb-3 border-b border-gray-200 pb-3">
                                <label className="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
                                  <input type="radio" name={`main-${item.id}`} value="Handicap" checked={mainOpt === 'Handicap'} onChange={() => setSelectedMainOptions({...selectedMainOptions, [item.id]: 'Handicap'})} className="accent-blue-600"/> Handicap
                                </label>
                                <label className="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
                                  <input type="radio" name={`main-${item.id}`} value="Under/Over" checked={mainOpt === 'Under/Over'} onChange={() => setSelectedMainOptions({...selectedMainOptions, [item.id]: 'Under/Over'})} className="accent-blue-600"/> Under/Over
                                </label>
                              </div>
                              <p className="text-xs font-bold text-gray-500 mb-2 uppercase">Lựa chọn 2</p>
                              <div className="flex gap-4">
                                <label className="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
                                  <input type="radio" name={`sub-${item.id}`} value="Trên" checked={subOpt === 'Trên'} onChange={() => setSelectedSubOptions({...selectedSubOptions, [item.id]: 'Trên'})} className="accent-blue-600"/> Trên
                                </label>
                                <label className="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
                                  <input type="radio" name={`sub-${item.id}`} value="Dưới" checked={subOpt === 'Dưới'} onChange={() => setSelectedSubOptions({...selectedSubOptions, [item.id]: 'Dưới'})} className="accent-blue-600"/> Dưới
                                </label>
                              </div>
                            </div>
                          </div>
                          
                          <div className="w-full sm:w-48 bg-gray-50 p-3 rounded-lg border border-gray-200 h-fit">
                            <div className="flex justify-between items-center mb-2">
                              <span className="text-sm font-medium text-gray-700">Số lượng:</span>
                              <span className="font-bold text-lg text-blue-600">{qty}</span>
                            </div>
                            <input type="range" min="0" max="10" step="2" value={qty} onChange={(e) => handleSliderChange(item.id, e.target.value)} className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600"/>
                            <div className="flex justify-between text-xs text-gray-400 mt-1"><span>0</span><span>10</span></div>
                          </div>
                        </div>
                      );
                    })}
                    <div className="fixed bottom-0 left-0 right-0 p-4 bg-white border-t border-gray-200 z-20">
                      <div className="max-w-2xl mx-auto">
                        <button onClick={handleOrder} className="w-full bg-green-600 text-white font-bold py-3 rounded-xl flex justify-center gap-2 hover:bg-green-700"><Icon name="ShoppingCart" size={20} /> Xác Nhận Đặt Món</button>
                      </div>
                    </div>
                  </div>
                )
              )}

              {activeTab === 'history' && (
                <div className="space-y-4">
                  {myOrders.length === 0 ? (
                    <div className="text-center p-10 bg-white rounded-xl border border-gray-200"><p className="text-gray-500">Bạn chưa đặt món nào.</p></div>
                  ) : (
                    myOrders.map(order => {
                      const item = menuItems.find(m => m.id === order.itemId);
                      const isConfirmed = order.status === 'confirmed';
                      return (
                        <div key={order.id} className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex flex-col sm:flex-row gap-4 justify-between">
                          <div>
                            <h3 className="text-lg font-bold text-gray-800">{item ? item.name : 'Món đã xóa'}</h3>
                            <p className="text-sm text-gray-500 mt-1">Tùy chọn: <span className="font-medium text-blue-600">{order.option}</span></p>
                            <div className="mt-2">
                              {isConfirmed ? <span className="text-green-600 flex items-center gap-1 text-sm font-medium"><Icon name="CheckCircle" size={16}/> Admin đã chốt đơn</span>
                              : <span className="text-orange-500 flex items-center gap-1 text-sm font-medium"><Icon name="Clock" size={16}/> Chờ admin xác nhận</span>}
                            </div>
                          </div>
                          <div className="flex items-center gap-4 bg-gray-50 p-2 rounded-lg border border-gray-200 w-full sm:w-auto h-fit">
                            {isConfirmed ? <div className="px-4 py-2 font-bold text-lg text-gray-700">Số lượng: {order.quantity}</div> : (
                              <>
                                <div className="flex items-center gap-3">
                                  <button onClick={() => handleAdjustQuantity(order.id, order.quantity - 2)} className="w-8 h-8 bg-white border border-gray-300 rounded font-bold">-</button>
                                  <span className="font-bold text-lg w-6 text-center">{order.quantity}</span>
                                  <button onClick={() => handleAdjustQuantity(order.id, order.quantity + 2)} className="w-8 h-8 bg-white border border-gray-300 rounded font-bold">+</button>
                                </div>
                                <button onClick={() => handleAdjustQuantity(order.id, 0)} className="p-2 text-red-500 hover:bg-red-50 rounded"><Icon name="Trash2" size={20} /></button>
                              </>
                            )}
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>
              )}

              {activeTab === 'profile' && (
                <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                  <h2 className="text-lg font-bold mb-4 flex items-center gap-2"><Icon name="Key" size={20}/> Đổi mật khẩu đăng nhập</h2>
                  <form onSubmit={handleChangePassword} className="space-y-4">
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-1">Mật khẩu cũ</label>
                      <input type="password" value={oldPass} onChange={(e) => setOldPass(e.target.value)} className="w-full p-2 border border-gray-300 rounded outline-none focus:border-green-500" required />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-1">Mật khẩu mới</label>
                      <input type="password" value={newPass} onChange={(e) => setNewPass(e.target.value)} className="w-full p-2 border border-gray-300 rounded outline-none focus:border-green-500" required />
                    </div>
                    <button type="submit" className="bg-green-600 text-white px-4 py-2 rounded font-medium hover:bg-green-700">Cập Nhật Mật Khẩu</button>
                  </form>
                </div>
              )}
            </div>
          </div>
        );
      };

      return (
        <>
          {!currentUser ? <Login /> : currentUser.role === 'admin' ? <AdminDashboard /> : <UserDashboard />}
          {messageBox && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-xl p-6 max-w-sm w-full shadow-2xl">
                <p className="text-gray-800 font-medium mb-6 text-center">{messageBox.message}</p>
                <div className="flex gap-3 justify-center">
                  {messageBox.type === 'confirm' && <button onClick={() => setMessageBox(null)} className="px-4 py-2 bg-gray-200 rounded-lg font-medium">Hủy</button>}
                  <button onClick={() => { if (messageBox.onConfirm) messageBox.onConfirm(); setMessageBox(null); }} className="px-4 py-2 bg-blue-600 text-white rounded-lg font-medium">Đồng ý</button>
                </div>
              </div>
            </div>
          )}
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
