<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ẩm Thực Sân Cỏ</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: #09090b; /* zinc-950 */
      color: #e4e4e7; /* zinc-200 */
    }
    
    .font-serif {
      font-family: 'Playfair Display', serif;
    }

    /* Custom inputs for dark theme */
    .lux-input {
      width: 100%;
      background: #18181b; /* zinc-900 */
      border: 1px solid #27272a; /* zinc-800 */
      border-radius: 0.5rem;
      padding: 0.5rem 1rem;
      color: #f4f4f5;
      outline: none;
      transition: all 0.2s;
    }
    .lux-input:focus {
      border-color: #f59e0b; /* amber-500 */
      box-shadow: 0 0 0 1px #f59e0b;
    }

    .lux-btn {
      border: 1px solid transparent;
      border-radius: 0.5rem;
      transition: all 0.2s;
      font-weight: 500;
    }
    
    .lux-card {
      background: #18181b; /* zinc-900 */
      border: 1px solid #27272a; /* zinc-800 */
      border-radius: 1rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
    }

    /* Custom Radio Buttons */
    input[type="radio"] {
      appearance: none;
      width: 1.25rem;
      height: 1.25rem;
      border: 1px solid #52525b;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      position: relative;
      top: 2px;
    }
    input[type="radio"]:checked {
      border-color: #f59e0b;
    }
    input[type="radio"]:checked::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 0.6rem;
      height: 0.6rem;
      background: #f59e0b;
      border-radius: 50%;
    }

    /* Custom Range Slider */
    input[type=range] {
      -webkit-appearance: none;
      background: transparent;
      width: 100%;
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      background: #27272a;
      border-radius: 2px;
    }
    input[type=range]::-webkit-slider-thumb {
      height: 16px;
      width: 16px;
      border-radius: 50%;
      background: #f59e0b;
      cursor: pointer;
      -webkit-appearance: none;
      margin-top: -6px;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime"
      }
    }
  </script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from 'react';
    import { createRoot } from 'react-dom/client';
    import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, collection, onSnapshot, doc, setDoc, addDoc, updateDoc, deleteDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyDyl2FoFZwKtFL6yb2sPEEWzJvBBzNK01A",
      authDomain: "taskhub-c3f41.firebaseapp.com",
      projectId: "taskhub-c3f41",
      storageBucket: "taskhub-c3f41.firebasestorage.app",
      messagingSenderId: "874827473111",
      appId: "1:874827473111:web:cdbd7c6b8d5ece0d285092"
    };

    const app = !getApps().length ? initializeApp(firebaseConfig) : getApp();
    const auth = getAuth(app);
    const db = getFirestore(app);

    const getColl = (name) => collection(db, 'artifacts', 'food-order', 'public', 'data', name);
    const getDocRef = (name, docId) => doc(db, 'artifacts', 'food-order', 'public', 'data', name, docId);

    const getVietnamTime = () => {
      const d = new Date();
      const vnTimeStr = d.toLocaleString("en-US", { timeZone: "Asia/Ho_Chi_Minh" });
      const vnDate = new Date(vnTimeStr);
      const yyyy = vnDate.getFullYear();
      const mth = String(vnDate.getMonth() + 1).padStart(2, '0');
      const dd = String(vnDate.getDate()).padStart(2, '0');
      const hh = String(vnDate.getHours()).padStart(2, '0');
      const mm = String(vnDate.getMinutes()).padStart(2, '0');
      return { date: `${yyyy}-${mth}-${dd}`, time: `${hh}:${mm}` };
    };

    const Icon = ({ name, size = 24, className = "" }) => {
      const paths = {
        UserPlus: <g><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></g>,
        PlusCircle: <g><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></g>,
        LogOut: <g><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></g>,
        Utensils: <g><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></g>,
        ClipboardList: <g><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></g>,
        User: <g><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></g>,
        Lock: <g><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></g>,
        ChefHat: <g><path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z"/><line x1="6" y1="17" x2="18" y2="17"/></g>,
        ShoppingCart: <g><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></g>,
        Trash2: <g><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></g>,
        CheckCircle: <g><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></g>,
        Clock: <g><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></g>,
        Key: <g><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></g>,
        Calendar: <g><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></g>,
        Filter: <g><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></g>
      };
      return (
        <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          {paths[name] || null}
        </svg>
      );
    };

    const Login = ({ users, setCurrentUser }) => {
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');

      const handleLogin = (e) => {
        e.preventDefault();
        const user = users.find(u => u.username === username && u.password === password);
        if (user) {
          if (user.isLocked) {
            setError('Tài khoản hiện đang tạm khóa vì nghi ngờ gian lận. Vui lòng liên hệ bộ phận CSKH để tìm hiểu thêm.');
          } else {
            setCurrentUser(user);
            setError('');
          }
        } else {
          setError('Thông tin đăng nhập không chính xác.');
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4 relative overflow-hidden bg-zinc-950">
          <div 
            className="absolute inset-0 z-0 bg-cover bg-center bg-no-repeat opacity-40"
            style={{ backgroundImage: `url('https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?auto=format&fit=crop&q=80')`, filter: 'blur(4px)' }}
          />
          
          <div className="lux-card w-full max-w-md z-10 relative overflow-hidden border border-zinc-700/50 backdrop-blur-md bg-zinc-900/80">
            <div className="flex flex-col items-center mb-2 border-b border-zinc-800 pb-6 pt-8 bg-gradient-to-b from-zinc-800/50 to-transparent">
              <div className="text-amber-500 mb-3"><Icon name="Utensils" size={48} /></div>
              <h1 className="text-3xl font-serif text-white tracking-wide">Ẩm Thực Sân Cỏ</h1>
              <p className="text-zinc-400 text-sm mt-2 uppercase tracking-widest">Premium Dining</p>
            </div>
            <form onSubmit={handleLogin} className="space-y-5 px-8 pb-8 pt-4">
              <div>
                <label className="block text-zinc-400 text-xs uppercase tracking-wider mb-2">Định danh (ID)</label>
                <div className="relative">
                  <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-zinc-500"><Icon name="User" size={18} /></div>
                  <input type="text" value={username} onChange={(e) => setUsername(e.target.value)} className="lux-input pl-10" required />
                </div>
              </div>
              <div>
                <label className="block text-zinc-400 text-xs uppercase tracking-wider mb-2">Mã an toàn (Password)</label>
                <div className="relative">
                  <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-zinc-500"><Icon name="Lock" size={18} /></div>
                  <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} className="lux-input pl-10" required />
                </div>
              </div>
              {error && <p className="text-red-400 text-sm text-center bg-red-950/30 py-2 rounded border border-red-900/50">{error}</p>}
              <button type="submit" className="lux-btn w-full bg-amber-600 hover:bg-amber-500 text-zinc-950 text-lg py-3 mt-4 transition-colors">
                ĐĂNG NHẬP
              </button>
            </form>
          </div>
        </div>
      );
    };

    const AdminDashboard = ({ users, menuItems, orders, currentUser, setCurrentUser, showMessage, showConfirm }) => {
      const [newUsername, setNewUsername] = useState('');
      const [newPassword, setNewPassword] = useState('');
      const [foodName, setFoodName] = useState('');
      const [foodNote, setFoodNote] = useState('');
      const [activeTab, setActiveTab] = useState('menu');
      const [filterUser, setFilterUser] = useState('all');
      const [filterDate, setFilterDate] = useState('');
      const [filterOrderFood, setFilterOrderFood] = useState('all');
      const [filterHistoryFood, setFilterHistoryFood] = useState('all');

      const { date: todayStr } = getVietnamTime();

      const handleCreateUser = async (e) => {
        e.preventDefault();
        if (users.some(u => u.username === newUsername)) {
          showMessage('Tên người dùng đã tồn tại!');
          return;
        }
        await addDoc(getColl('users'), { username: newUsername, password: newPassword, role: 'user', isLocked: false });
        setNewUsername('');
        setNewPassword('');
        showMessage('Đã tạo thẻ thành viên mới.');
      };

      const toggleUserLock = async (user) => {
        const confirmMsg = user.isLocked 
          ? `Bạn có muốn mở khóa tài khoản "${user.username}"?` 
          : `Bạn có chắc muốn tạm khóa tài khoản "${user.username}"? Khách sẽ không thể đăng nhập.`;
        
        showConfirm(confirmMsg, async () => {
          await updateDoc(getDocRef('users', user.id), { isLocked: !user.isLocked });
          showMessage(user.isLocked ? `Đã mở khóa tài khoản ${user.username}.` : `Đã khóa tài khoản ${user.username}.`);
        });
      };

      const handleCreateFood = async (e) => {
        e.preventDefault();
        await addDoc(getColl('menuItems'), { name: foodName, note: foodNote, isActive: true });
        setFoodName('');
        setFoodNote('');
        showMessage('Đã đưa món vào thực đơn.');
      };

      const toggleFoodStatus = async (item) => {
        await updateDoc(getDocRef('menuItems', item.id), { isActive: item.isActive === false ? true : false });
      };

      const deleteFood = (itemId) => {
        showConfirm("Hủy bỏ món ăn này khỏi hệ thống?", async () => {
          await deleteDoc(getDocRef('menuItems', itemId));
        });
      };

      const confirmOrder = async (orderId) => {
        await updateDoc(getDocRef('orders', orderId), { status: 'confirmed' });
      };

      const deleteOrder = (orderId) => {
        showConfirm("Bạn có chắc chắn muốn xóa đơn hàng này khỏi hệ thống?", async () => {
          await deleteDoc(getDocRef('orders', orderId));
        });
      };

      // Helper function to extract unique item names from all orders, for filtering history
      const getUniqueOrderedItems = () => {
        const uniqueItemsMap = new Map();
        orders.forEach(order => {
          if (order.itemName) {
            uniqueItemsMap.set(order.itemName, order.itemName);
          }
        });
        return Array.from(uniqueItemsMap.values());
      };


      return (
        <div className="min-h-screen pb-12">
          <header className="border-b border-zinc-800 bg-zinc-950 p-4 sticky top-0 z-20 shadow-md">
            <div className="max-w-6xl mx-auto flex justify-between items-center">
              <h1 className="text-xl md:text-2xl font-serif text-amber-500 flex items-center gap-2">
                <Icon name="ChefHat" /> Bếp Trưởng (Admin)
              </h1>
              <button onClick={() => setCurrentUser(null)} className="flex items-center gap-2 text-sm text-zinc-400 hover:text-white transition-colors">
                <Icon name="LogOut" size={18} /> Rời đi
              </button>
            </div>
          </header>

          <div className="max-w-6xl mx-auto px-4 mt-8">
            <div className="flex gap-2 mb-8 overflow-x-auto pb-2 scrollbar-hide">
              <button onClick={() => setActiveTab('menu')} className={`px-5 py-2.5 rounded-lg text-sm font-medium whitespace-nowrap transition-colors ${activeTab === 'menu' ? 'bg-amber-500/10 text-amber-500 border border-amber-500/30' : 'text-zinc-400 hover:bg-zinc-900 border border-transparent'}`}>Thực Đơn</button>
              <button onClick={() => setActiveTab('users')} className={`px-5 py-2.5 rounded-lg text-sm font-medium whitespace-nowrap transition-colors ${activeTab === 'users' ? 'bg-amber-500/10 text-amber-500 border border-amber-500/30' : 'text-zinc-400 hover:bg-zinc-900 border border-transparent'}`}>Khách Hàng</button>
              <button onClick={() => setActiveTab('orders')} className={`px-5 py-2.5 rounded-lg text-sm font-medium whitespace-nowrap transition-colors ${activeTab === 'orders' ? 'bg-amber-500/10 text-amber-500 border border-amber-500/30' : 'text-zinc-400 hover:bg-zinc-900 border border-transparent'}`}>Đơn Hôm Nay</button>
              <button onClick={() => setActiveTab('history')} className={`px-5 py-2.5 rounded-lg text-sm font-medium whitespace-nowrap transition-colors ${activeTab === 'history' ? 'bg-amber-500/10 text-amber-500 border border-amber-500/30' : 'text-zinc-400 hover:bg-zinc-900 border border-transparent'}`}>Sổ Lịch Sử</button>
            </div>

            {activeTab === 'menu' && (
              <div className="lux-card p-6">
                <div className="flex items-center gap-3 mb-6 border-b border-zinc-800 pb-4">
                  <div className="p-2 bg-amber-500/10 rounded-lg text-amber-500"><Icon name="PlusCircle" size={20}/></div>
                  <h2 className="font-serif text-xl text-white">Thêm Món Mới</h2>
                </div>
                <form onSubmit={handleCreateFood} className="space-y-4">
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-zinc-400 text-xs uppercase tracking-wider mb-2">Tên Món Ăn</label>
                      <input type="text" value={foodName} onChange={(e) => setFoodName(e.target.value)} className="lux-input" required placeholder="Ví dụ: Bò Wagyu A5..." />
                    </div>
                    <div>
                      <label className="block text-zinc-400 text-xs uppercase tracking-wider mb-2">Mô tả / Thành phần</label>
                      <input type="text" value={foodNote} onChange={(e) => setFoodNote(e.target.value)} className="lux-input" placeholder="Ví dụ: Sốt nấm Truffle, măng tây..." />
                    </div>
                  </div>
                  <div className="flex justify-end pt-2">
                    <button type="submit" className="lux-btn bg-zinc-100 hover:bg-white text-zinc-900 px-6 py-2">Đưa Vào Thực Đơn</button>
                  </div>
                </form>

                <div className="mt-10 border-t border-zinc-800/50 pt-6">
                  <h3 className="font-serif text-lg text-zinc-300 mb-4">Danh sách món đang phục vụ:</h3>
                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                    {menuItems.map(item => (
                      <div key={item.id} className={`p-4 rounded-xl border border-zinc-800 flex justify-between items-center transition-all ${item.isActive === false ? 'bg-zinc-900/30 opacity-60' : 'bg-zinc-900/80 hover:border-zinc-700'}`}>
                        <div>
                          <p className="font-medium text-white flex items-center gap-2">
                            {item.name} 
                            {item.isActive === false && <span className="text-[10px] uppercase tracking-wider bg-red-950/50 text-red-400 px-2 py-0.5 rounded border border-red-900/50">Tạm Ngưng</span>}
                          </p>
                          <p className="text-sm text-zinc-500 mt-1">{item.note}</p>
                        </div>
                        <div className="flex items-center gap-2">
                          <button onClick={() => toggleFoodStatus(item)} className="lux-btn bg-zinc-800 text-zinc-300 px-3 py-1.5 text-xs hover:bg-zinc-700">
                            {item.isActive === false ? 'Phục Vụ' : 'Ngưng'}
                          </button>
                          <button onClick={() => deleteFood(item.id)} className="lux-btn bg-red-950/30 text-red-400 px-2 py-1.5 hover:bg-red-900/50 border border-red-900/30"><Icon name="Trash2" size={16}/></button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'users' && (
              <div className="lux-card p-6">
                <div className="flex items-center gap-3 mb-6 border-b border-zinc-800 pb-4">
                  <div className="p-2 bg-amber-500/10 rounded-lg text-amber-500"><Icon name="UserPlus" size={20}/></div>
                  <h2 className="font-serif text-xl text-white">Khách VIP & Thành Viên</h2>
                </div>
                <form onSubmit={handleCreateUser} className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                  <div>
                    <label className="block text-zinc-400 text-xs uppercase tracking-wider mb-2">Định danh (ID)</label>
                    <input type="text" value={newUsername} onChange={(e) => setNewUsername(e.target.value)} className="lux-input py-2" required />
                  </div>
                  <div>
                    <label className="block text-zinc-400 text-xs uppercase tracking-wider mb-2">Mã an toàn (Password)</label>
                    <input type="text" value={newPassword} onChange={(e) => setNewPassword(e.target.value)} className="lux-input py-2" required />
                  </div>
                  <div className="flex items-end">
                    <button type="submit" className="lux-btn w-full py-2 bg-zinc-800 border-zinc-700 hover:border-amber-500 text-white">Cấp Thẻ Mới</button>
                  </div>
                </form>
                
                <div className="border-t border-zinc-800/50 pt-6">
                  <h3 className="font-serif text-lg text-zinc-300 mb-4">Danh sách thành viên:</h3>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {users.filter(u => u.role !== 'admin').map((u, idx) => (
                      <div key={idx} className={`p-4 rounded-xl border border-zinc-800 bg-zinc-900/50 flex flex-col justify-between ${u.isLocked ? 'opacity-75' : ''}`}>
                        <div className="flex justify-between items-start mb-3">
                          <div>
                            <div className="text-zinc-200 font-medium">{u.username}</div>
                            <div className="text-zinc-500 text-sm font-mono mt-1">Pass: {u.password}</div>
                          </div>
                          {u.isLocked && <span className="bg-red-500/20 text-red-400 text-xs px-2 py-1 rounded border border-red-500/30">BỊ KHÓA</span>}
                        </div>
                        <div className="flex items-center gap-2 mt-2 pt-3 border-t border-zinc-800/50">
                          <button 
                            onClick={() => toggleUserLock(u)}
                            className={`flex-1 text-xs py-1.5 rounded border transition-colors ${u.isLocked ? 'border-amber-500/50 text-amber-500 hover:bg-amber-500/10' : 'border-red-500/30 text-red-400 hover:bg-red-500/10'}`}
                          >
                            {u.isLocked ? 'Mở Khóa' : 'Tạm Khóa'}
                          </button>
                          <button 
                            onClick={() => { setActiveTab('history'); setFilterUser(u.username); setFilterDate(''); }}
                            className="flex-1 text-zinc-400 hover:text-amber-500 text-xs py-1.5 rounded border border-zinc-800 hover:border-amber-500/50 transition-colors bg-zinc-800/50"
                          >
                            Lịch sử
                          </button>
                        </div>
                      </div>

                  <div className="overflow-x-auto">

                      <thead>
                        <tr className="border-b border-zinc-800 text-zinc-400 uppercase tracking-wider text-xs">
                          <th className="pb-3 px-4 font-medium">Thời gian</th>
                          <th className="pb-3 px-4 font-medium">Thực khách</th>
                          <th className="pb-3 px-4 font-medium">Món ăn</th>
                          <th className="pb-3 px-4 font-medium">Tùy chọn</th>

                          const matchFood = filterHistoryFood === 'all' ? true : orderItemName === filterHistoryFood;
                          
                          return matchDate && matchUser && matchFood;

      const [selectedMainOptions, setSelectedMainOptions] = useState({});
      const [selectedSubOptions, setSelectedSubOptions] = useState({});
      const [activeTab, setActiveTab] = useState('menu');

      const [newPass, setNewPass] = useState('');

        let totalItems = 0;
        let orderedCount = 0;
        
        const { date: todayStr, time: timeStr } = getVietnamTime();

        const promises = Object.entries(quantities).map(async ([itemId, qty]) => {
          if (qty > 0) {
            const mainOpt = selectedMainOptions[itemId] || 'Handicap';
            const subOpt = selectedSubOptions[itemId] || 'Trên';
            const finalOption = `${mainOpt} - ${subOpt}`;
            
            // Lấy tên món ăn tại thời điểm đặt để lưu vào DB
            const menuItem = menuItems.find(m => m.id === itemId);
            const itemNameToSave = menuItem ? menuItem.name : 'Unknown Item';

            await addDoc(getColl('orders'), { 
              username: currentUser.username, 
              itemId: itemId, 
              itemName: itemNameToSave, // LƯU TRỰC TIẾP TÊN MÓN VÀO DATABASE
              quantity: qty, 
              option: finalOption,
              status: 'pending',
              date: todayStr,
              time: timeStr
            });
            totalItems += qty;
            orderedCount++;
          }
        });

        await Promise.all(promises);

        if (orderedCount === 0) {
          showMessage('Vui lòng chọn ít nhất 1 món để phục vụ.');
          return;
        }

        setQuantities({});
        setSelectedMainOptions({});
        setSelectedSubOptions({});
        showMessage(`Đã gửi yêu cầu ${totalItems} phần lên bếp!`);
        setActiveTab('history');
      };

      const handleAdjustQuantity = async (orderId, newQty) => {
        if (newQty <= 0) {
          showConfirm("Bạn có muốn hủy món này?", async () => {
            await deleteDoc(getDocRef('orders', orderId));
          });
        } else {
          await updateDoc(getDocRef('orders', orderId), { quantity: newQty });
        }
      };

      const handleChangePassword = async (e) => {
        e.preventDefault();
        if (oldPass !== currentUser.password) {
          showMessage('Mã an toàn cũ không chính xác.');
          return;
        }
        if (newPass.length < 3) {
          showMessage('Mã an toàn mới quá ngắn.');
          return;
        }
        await updateDoc(getDocRef('users', currentUser.id), { password: newPass });
        setCurrentUser({...currentUser, password: newPass});
        setOldPass('');
        setNewPass('');
        showMessage('Cập nhật mã an toàn thành công!');
      };

      const myOrders = orders.filter(o => o.username === currentUser.username).sort((a, b) => new Date(b.date || '2000-01-01') - new Date(a.date || '2000-01-01'));

                  <Icon name="LogOut" size={18} /> Rời đi
                </button>
              </div>
            </div>
          </header>

              <button onClick={() => setActiveTab('history')} className={`px-5 py-2.5 rounded-lg text-sm font-medium whitespace-nowrap transition-colors flex items-center gap-2 ${activeTab === 'history' ? 'bg-amber-500/10 text-amber-500 border border-amber-500/30' : 'text-zinc-400 hover:bg-zinc-900 border border-transparent'}`}>
                Sổ Lưu Đơn {myOrders.length > 0 && <span className="bg-amber-500 text-zinc-950 text-[10px] px-1.5 py-0.5 rounded-full font-bold">{myOrders.length}</span>}
              </button>
              <button onClick={() => setActiveTab('profile')} className={`px-5 py-2.5 rounded-lg text-sm font-medium whitespace-nowrap transition-colors flex items-center gap-2 ${activeTab === 'profile' ? 'bg-amber-500/10 text-amber-500 border border-amber-500/30' : 'text-zinc-400 hover:bg-zinc-900 border border-transparent'}`}>

                  <p className="text-zinc-400 text-lg font-serif">Bếp trưởng đang chuẩn bị thực đơn...</p>

                <div className="space-y-6">

                      <div key={item.id} className="lux-card p-5 flex flex-col md:flex-row gap-6 justify-between transition-colors hover:border-zinc-700">

                          {item.note && <p className="text-sm text-zinc-400 mb-5">{item.note}</p>}
                          
                          <div className="bg-zinc-950/50 rounded-lg p-4 border border-zinc-800/50">
                            <div className="grid grid-cols-2 gap-6">
                              <div>
                                <p className="text-[10px] uppercase tracking-widest text-zinc-500 mb-3 font-semibold">Tùy Chọn 1</p>

                                  <label className="flex items-center gap-3 text-sm text-zinc-300 cursor-pointer group">

                                  <label className="flex items-center gap-3 text-sm text-zinc-300 cursor-pointer group">
                                    <input type="radio" name={`sub-${item.id}`} value="Trên" checked={subOpt === 'Trên'} onChange={() => setSelectedSubOptions({...selectedSubOptions, [item.id]: 'Trên'})} />

                                    <input type="radio" name={`sub-${item.id}`} value="Dưới" checked={subOpt === 'Dưới'} onChange={() => setSelectedSubOptions({...selectedSubOptions, [item.id]: 'Dưới'})} /> 
                                    <span className="group-hover:text-amber-500 transition-colors">Dưới</span>
                                  </label>
                                </div>
                              </div>
                            </div>
                          </div>

                        <div className="w-full md:w-48 bg-zinc-900/80 rounded-lg border border-zinc-800 p-4 flex flex-col justify-center">

                            <span className="text-xs uppercase tracking-wider text-zinc-400">Số lượng</span>
                            <span className="font-serif text-2xl text-white">{qty}</span>
                          </div>
                          <input type="range" min="0" max="10" step="2" value={qty} onChange={(e) => handleSliderChange(item.id, e.target.value)} />
                          <div className="flex justify-between text-xs text-zinc-600 mt-2 font-mono"><span>0</span><span>10</span></div>
                        </div>
                      </div>
                    );
                  })}
                  
                  <div className="fixed bottom-0 left-0 right-0 p-4 bg-zinc-950/90 backdrop-blur-lg border-t border-zinc-800 z-30">

                        <Icon name="ShoppingCart" size={20} /> CHUYỂN ORDER LÊN BẾP
                      </button>
                    </div>
                  </div>

            )}

            {activeTab === 'history' && (

                {myOrders.length === 0 ? (

                  myOrders.map(order => {
                    const currentMenuItem = menuItems.find(m => m.id === order.itemId);

                          <div className="mt-1">
                            {isConfirmed ? <span className="text-emerald-500 flex items-center gap-1.5 text-xs font-medium"><Icon name="CheckCircle" size={14}/> Đã được bếp tiếp nhận</span>
                            : <span className="text-amber-500 flex items-center gap-1.5 text-xs font-medium"><Icon name="Clock" size={14}/> Đang chờ bếp xác nhận</span>}
                          </div>
                        </div>
                        <div className="flex flex-col sm:flex-row md:flex-col items-center gap-3 bg-zinc-950/50 rounded-lg border border-zinc-800 p-3 w-full md:w-auto justify-center">
                          {isConfirmed ? <div className="text-sm text-zinc-400 text-center uppercase tracking-widest">Số lượng: <span className="text-2xl font-serif text-white block mt-1">{order.quantity}</span></div> : (
                            <>
                              <div className="text-[10px] uppercase tracking-widest text-zinc-500 mb-1">Chỉnh số lượng</div>
                              <div className="flex items-center gap-1 bg-zinc-900 rounded-md p-1 border border-zinc-800">
                                <button onClick={() => handleAdjustQuantity(order.id, order.quantity - 2)} className="w-8 h-8 flex items-center justify-center rounded text-zinc-400 hover:text-white hover:bg-zinc-800 transition-colors">-</button>
                                <span className="text-lg font-serif text-white w-8 text-center">{order.quantity}</span>
                                <button onClick={() => handleAdjustQuantity(order.id, order.quantity + 2)} className="w-8 h-8 flex items-center justify-center rounded text-zinc-400 hover:text-white hover:bg-zinc-800 transition-colors">+</button>
                              </div>
                              <button onClick={() => handleAdjustQuantity(order.id, 0)} className="text-xs text-red-400 hover:text-red-300 flex items-center gap-1 mt-2 transition-colors py-1"><Icon name="Trash2" size={14} /> Hủy món</button>
                            </>
                          )}
                        </div>
                      </div>
                    );
                  })
                )}
              </div>
            )}

            {activeTab === 'profile' && (
              <div className="lux-card p-6">
                <div className="flex items-center gap-3 mb-6 border-b border-zinc-800 pb-4">
                  <div className="p-2 bg-amber-500/10 rounded-lg text-amber-500"><Icon name="Key" size={20}/></div>
                  <h2 className="font-serif text-xl text-white">Bảo Mật Tài Khoản</h2>
                </div>
                <form onSubmit={handleChangePassword} className="space-y-5 max-w-md">
                  <div>
                    <label className="block text-zinc-400 text-xs uppercase tracking-wider mb-2">Mã an toàn hiện tại</label>
                    <input type="password" value={oldPass} onChange={(e) => setOldPass(e.target.value)} className="lux-input" required />
                  </div>
                  <div>
                    <label className="block text-zinc-400 text-xs uppercase tracking-wider mb-2">Mã an toàn mới</label>
                    <input type="password" value={newPass} onChange={(e) => setNewPass(e.target.value)} className="lux-input" required />
                  </div>
                  <button type="submit" className="lux-btn bg-zinc-100 hover:bg-white text-zinc-900 px-6 py-2.5">Cập Nhật</button>
                </form>
              </div>
            )}
          </div>
        </div>
      );
    };

    function App() {
      const [users, setUsers] = useState([]);
      const [menuItems, setMenuItems] = useState([]);
      const [orders, setOrders] = useState([]);
      const [currentUser, setCurrentUser] = useState(null);
      const [firebaseUser, setFirebaseUser] = useState(null);
      const [messageBox, setMessageBox] = useState(null);

      const showMessage = (msg) => setMessageBox({ type: 'alert', message: msg });
      const showConfirm = (msg, onConfirm) => setMessageBox({ type: 'confirm', message: msg, onConfirm });

      useEffect(() => {
        signInAnonymously(auth).catch(console.error);
        const unsub = onAuthStateChanged(auth, user => setFirebaseUser(user));
        return () => unsub();
      }, []);

      useEffect(() => {
        if (!firebaseUser) return;
        
        const unsubUsers = onSnapshot(getColl('users'), snap => {
          if (snap.empty) {
            setDoc(getDocRef('users', 'admin'), { username: 'admin', password: '123', role: 'admin', isLocked: false });
          } else {
            setUsers(snap.docs.map(d => ({ id: d.id, ...d.data() })));
          }
        }, console.error);

        const unsubMenu = onSnapshot(getColl('menuItems'), snap => {
          setMenuItems(snap.docs.map(d => ({ id: d.id, ...d.data() })));
        }, console.error);

        const unsubOrders = onSnapshot(getColl('orders'), snap => {
          const ordersData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          setOrders(ordersData);

          const { date: todayStr } = getVietnamTime();

          ordersData.forEach(order => {
            if (order.date === undefined || order.time === undefined) {
              updateDoc(getDocRef('orders', order.id), { 
                date: order.date || todayStr,
                time: order.time || '--:--'
              });
            }
          });
        }, console.error);

        return () => { unsubUsers(); unsubMenu(); unsubOrders(); };
      }, [firebaseUser]);

      return (
        <>
          {!currentUser ? (
            <Login users={users} setCurrentUser={setCurrentUser} />
          ) : currentUser.role === 'admin' ? (
            <AdminDashboard users={users} menuItems={menuItems} orders={orders} currentUser={currentUser} setCurrentUser={setCurrentUser} showMessage={showMessage} showConfirm={showConfirm} />
          ) : (
            <UserDashboard menuItems={menuItems} orders={orders} currentUser={currentUser} setCurrentUser={setCurrentUser} showMessage={showMessage} showConfirm={showConfirm} />
          )}
          
          {messageBox && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="lux-card max-w-sm w-full p-6 text-center border-amber-500/30">
                <p className="text-lg text-white mb-8 leading-relaxed font-serif">{messageBox.message}</p>
                <div className="flex gap-3 justify-center">
                  {messageBox.type === 'confirm' && <button onClick={() => setMessageBox(null)} className="lux-btn bg-zinc-800 text-zinc-300 hover:bg-zinc-700 px-6 py-2 text-sm">Hủy</button>}
                  <button onClick={() => { if (messageBox.onConfirm) messageBox.onConfirm(); setMessageBox(null); }} className="lux-btn bg-amber-600 hover:bg-amber-500 text-zinc-950 px-6 py-2 text-sm font-semibold">Xác Nhận</button>
                </div>
              </div>
            </div>
          )}
        </>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
